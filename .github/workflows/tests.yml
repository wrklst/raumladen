name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The database the example environment expects.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: raumladen
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Application
        run: composer setup

      - name: Install the browser for browser tests
        run: npx playwright install --with-deps chromium

      # Browser and SSR tests need both bundles; `composer setup` only built the client.
      - name: Build SSR bundle
        run: npm run build:ssr

      - name: Run CI Checks
        run: composer ci:check
        env:
          # Vitest loads the Vite configuration; the Laravel plugin refuses that in CI.
          LARAVEL_BYPASS_ENV_CHECK: "1"

      - name: Lighthouse
        run: npx lhci autorun
